name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Prepare Android project
        shell: bash
        run: |
          set -e

          echo "Repository files:"
          find . -maxdepth 4 -type f -print

          echo "Searching for settings.gradle.kts..."

          SETTINGS=$(find . -type f -name "settings.gradle.kts" -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle.kts was not found anywhere."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Searching for app.zip..."

          APP_ZIP=$(find . -type f -name "app.zip" -print -quit)

          if [ -z "$APP_ZIP" ]; then
            echo "ERROR: app.zip was not found."
            exit 1
          fi

          echo "Found:"
          echo "$APP_ZIP"

          rm -rf "$PROJECT_DIR/app"

          mkdir -p "$PROJECT_DIR/app"

          unzip -q "$APP_ZIP" -d "$PROJECT_DIR/app"

          echo "Final Android project:"
          find "$PROJECT_DIR" -maxdepth 4 -type f -print

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Building from:"
          pwd

          echo "Project files:"
          ls -la

          gradle assembleDebug --stacktrace

      - name: Find APK
        shell: bash
        run: |
          echo "APK files:"
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-AI-APK
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
