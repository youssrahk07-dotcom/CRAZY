name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Prepare Android project
        shell: bash
        run: |
          set -e

          echo "Repository:"
          find . -maxdepth 3 -type f -print

          echo "Copying Gradle files to repository root..."
          cp .github/workflows/build.gradle.kts ./build.gradle.kts
          cp .github/workflows/settings.gradle.kts ./settings.gradle.kts

          echo "Finding app.zip..."
          APP_ZIP=$(find . -type f -name "app.zip" -print -quit)

          if [ -z "$APP_ZIP" ]; then
            echo "ERROR: app.zip not found"
            exit 1
          fi

          echo "Found: $APP_ZIP"

          rm -rf extracted app
          mkdir -p extracted

          unzip -q "$APP_ZIP" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 4 -print

          if [ -d "extracted/app" ]; then
            mv extracted/app ./app
          else
            mkdir -p app
            cp -r extracted/. app/
          fi

          rm -rf extracted

          echo "Final Gradle project:"
          ls -la
          ls -la app

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-AI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
