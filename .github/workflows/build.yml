name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Prepare Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=".github/workflows"

          echo "Project directory:"
          pwd
          echo "$PROJECT_DIR"

          echo "Checking project files:"
          ls -la "$PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle.kts not found"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/build.gradle.kts" ]; then
            echo "ERROR: build.gradle.kts not found"
            exit 1
          fi

          APP_ZIP="$PROJECT_DIR/app.zip"

          if [ ! -f "$APP_ZIP" ]; then
            echo "ERROR: app.zip not found"
            exit 1
          fi

          echo "Extracting app.zip..."

          rm -rf /tmp/app_extract
          mkdir -p /tmp/app_extract

          unzip -q "$APP_ZIP" -d /tmp/app_extract

          echo "ZIP contents:"
          find /tmp/app_extract -maxdepth 5 -type f -print

          rm -rf "$PROJECT_DIR/app"
          mkdir -p "$PROJECT_DIR/app"

          if [ -d "/tmp/app_extract/app" ]; then
            echo "Found app folder inside ZIP."

            cp -R /tmp/app_extract/app/. "$PROJECT_DIR/app/"

          else
            echo "ZIP contains app files directly."

            cp -R /tmp/app_extract/. "$PROJECT_DIR/app/"
          fi

          echo "Final app structure:"
          find "$PROJECT_DIR/app" -maxdepth 5 -type f -print

          echo "Checking Android build.gradle..."

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle.kts not found."
            echo "The app.zip does not contain the Android app correctly."
            exit 1
          fi

          echo "Android app detected successfully."

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Show Gradle projects
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Gradle project:"
          gradle projects

          echo "Available assemble tasks:"
          gradle tasks --all | grep -i assemble || true

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Building Android APK..."

          gradle :app:assembleDebug --stacktrace

      - name: Find APK
        shell: bash
        run: |
          echo "Searching for APK..."

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-AI-APK
          path: |
            .github/workflows/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
