name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract app
        run: |
          unzip -q app.zip -d extracted
          if [ -d "extracted/app" ]; then
            mv extracted/app ./app
          else
            mkdir -p app
            cp -r extracted/. app/
          fi
          rm -rf extracted app.zip

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-AI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
