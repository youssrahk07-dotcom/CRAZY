name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Find and extract app.zip
        shell: bash
        run: |
          set -e

          echo "Searching for app.zip..."

          APP_ZIP=$(find . -type f -name "app.zip" -print -quit)

          if [ -z "$APP_ZIP" ]; then
            echo "ERROR: app.zip was not found."
            find . -maxdepth 4 -type f -print
            exit 1
          fi

          echo "Found: $APP_ZIP"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$APP_ZIP" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 5 -print

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          if [ -f "extracted/settings.gradle.kts" ]; then
            echo "Android project found directly in extracted/"
            echo "PROJECT_DIR=extracted" >> "$GITHUB_ENV"

          elif [ -f "extracted/app/settings.gradle.kts" ]; then
            echo "Android project found in extracted/app/"
            echo "PROJECT_DIR=extracted/app" >> "$GITHUB_ENV"

          elif [ -f "extracted/android_project/settings.gradle.kts" ]; then
            echo "Android project found in extracted/android_project/"
            echo "PROJECT_DIR=extracted/android_project" >> "$GITHUB_ENV"

          else
            echo "ERROR: settings.gradle.kts was not found."
            echo "Searching:"
            find extracted -name "settings.gradle*" -print
            exit 1
          fi

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          echo "Building project from:"
          echo "$PROJECT_DIR"

          cd "$PROJECT_DIR"

          echo "Project files:"
          ls -la

          gradle assembleDebug --stacktrace

      - name: Find APK
        shell: bash
        run: |
          echo "Searching for APK..."
          find extracted -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-AI-APK
          path: extracted/**/*.apk
          if-no-files-found: error
